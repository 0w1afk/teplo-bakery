name: CI

# Проверки на каждый пуш и PR. Секреты и деплой сюда не попадают:
# выкладка — отдельный workflow Deploy (workflow_dispatch), см. site-fabric/DEPLOY.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Типы, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://teplo.zimorodok-dev.ru
      SITE_INDEXABLE: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Типы (Next)
        run: npm run typecheck --if-present

      - name: Типы и разметка (Astro)
        run: npm run check --if-present

      - name: Тесты
        run: npm test --if-present

      # Сборка сразу под адрес поддомена: ловим сломанные абсолютные пути до деплоя.
      - name: Сборка под https://teplo.zimorodok-dev.ru/
        run: npm run build
