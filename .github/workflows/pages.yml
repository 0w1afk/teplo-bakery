name: Pages

# Демо на GitHub Pages: https://0w1afk.github.io/teplo-bakery/
# Источник Pages — GitHub Actions (Settings → Pages → Source: GitHub Actions), не ветка:
# Pages не умеет собирать Astro, а dist/ в репозиторий не коммитится.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Astro читает base из SITE_BASE (astro.config.mjs)
      SITE_BASE: /teplo-bakery
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Типы и разметка
        run: npm run check --if-present

      - name: Сборка под /teplo-bakery/
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
